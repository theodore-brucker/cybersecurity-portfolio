name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  scan:
    name: Secret and SAST scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  build:
    name: Build site
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Fail if a draft leaked into the output
        run: |
          if grep -rl 'draft: true' _site/ 2>/dev/null | grep -q .; then
            echo "A draft post was written to the build output."
            exit 1
          fi
          echo "No drafts in output."

      - name: Verify feed and sitemap exist
        run: test -s _site/feed.xml && test -s _site/sitemap.xml
